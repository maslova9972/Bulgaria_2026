<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Переход на страницу события</title>
    <script>
      (() => {
        const correctedPath = window.location.pathname.replace(
          /(\/(?:index|breakfast|legal)\.html)\/+$/i,
          '$1',
        )

        if (correctedPath !== window.location.pathname) {
          window.location.replace(`${correctedPath}${window.location.search}${window.location.hash}`)
        }
      })()
    </script>
  </head>
  <body>
    <p>Страница не найдена. <a href="./">Вернуться на главную</a>.</p>
  </body>
</html>
